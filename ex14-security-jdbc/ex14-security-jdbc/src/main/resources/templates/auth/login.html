<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body {
			background: linear-gradient(135deg, #5f2c82, #49a09d);
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.login-card {
			width: 420px;
			border-radius: 15px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
		}
		.login-header {
			font-weight: bold;
			font-size: 22px;
		}
	</style>
</head>
<body>
	<div class="card login-card">
		<div class="card-body p-4">
			<!-- ================= 로그인 전 ================= -->
			<div th:if="${user_id == null}">
				<div class="text-center mb-4 login-header">
					🔐 Member Login
				</div>

				<!-- 로그인에 실패한 경우 에러 핸들러를 통해 전달되는 메세지를 출력한다. 즉 errorMsg라는 파라미터가 있는
				 경우에만 빨간색으로 오류 메세지를 출력한다. -->
				<div th:if="${param.errorMsg}" style="color: red;">
					오류 : [[${param.errorMsg}]]
				</div>				
        <!-- action 속성값은 loginProcessingUrl에 지정한 경로 및 요청명이다. -->
				<form method="post" action="/myLoginAction.do">
          <!-- 아이디와 패스워드 입력상자의 name 속성값은 시큐리티 설정파일에서 지정한 my_id, my_pass로
           작성해야한다. -->
					<div class="mb-3">
						<label class="form-label">아이디</label>
						<input type="text" name="my_id" class="form-control" placeholder="아이디 입력">
					</div>
					<div class="mb-3">
						<label class="form-label">비밀번호</label>
						<input type="password" name="my_pass" class="form-control" placeholder="비밀번호 입력">
					</div>
					<div class="d-grid">
						<button type="submit" class="btn btn-dark">
							로그인
						</button>
					</div>
				</form>
			</div>
			<!-- ================= 로그인 후 ================= -->
			<div th:if="${user_id != null}">
				<div class="text-center">
					<h4 class="mb-3">
						<span th:text="${user_id}"></span>님 로그인 중
					</h4>
					<div class="d-grid gap-2">
						<a href="/" class="btn btn-success">
							🏠 root로 바로가기
						</a>
						<a href="/myLogout.do" class="btn btn-outline-danger">
							로그아웃
						</a>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
