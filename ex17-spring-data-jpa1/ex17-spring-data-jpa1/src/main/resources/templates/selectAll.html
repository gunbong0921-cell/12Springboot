<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h2>Spring Data JPA - 전체 select</h2>
	<div th:each="row : ${members}">
	    <p>
	        아이디 : <span th:text="${row.id}">1</span><br>
	        이름 : <span th:text="${row.username}">홍길동</span><br>
	        날짜 : <span th:text="${#temporals.format(row.createDate, 'yyyy-MM-dd HH:mm:ss')}">2026-03-11</span>
	    </p>
	</div>
</body>
</html>
